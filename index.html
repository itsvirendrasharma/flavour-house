<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Flavor House – Restaurant Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================  LOGIN  ===================== -->
  <div id="login" class="login">
    <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="floaters" id="floaters" aria-hidden="true"></div>

    <div class="login-shell">
      <!-- brand side -->
      <section class="login-brand">
        <div class="orbit" aria-hidden="true">
          <div class="orbit-ring"></div>
          <div class="orbit-center">🍛</div>
          <span style="--i:0">🍕</span><span style="--i:1">🍔</span><span style="--i:2">🍜</span>
          <span style="--i:3">🍰</span><span style="--i:4">🥘</span><span style="--i:5">🍹</span>
        </div>
        <h2>Delicious Food,<br>Great Experience</h2>
        <p>Orders, billing, tables and customers – everything your restaurant needs in one place.</p>
      </section>

      <!-- form side -->
      <section class="login-card" id="loginCard">
        <div class="login-logo" id="loginLogo"></div>
        <h1>Welcome back</h1>
        <p class="sub">Sign in to manage <b>Flavor House</b></p>

        <form id="loginForm" autocomplete="on" novalidate>
          <div class="lf-field">
            <input id="lfUser" name="username" type="text" placeholder=" " autocomplete="username" required>
            <label for="lfUser">Username</label>
            <span class="lf-ic" data-ic="user"></span>
            <i class="lf-line"></i>
          </div>
          <div class="lf-field">
            <input id="lfPass" name="password" type="password" placeholder=" " autocomplete="current-password" required>
            <label for="lfPass">Password</label>
            <span class="lf-ic" data-ic="lock"></span>
            <button type="button" class="lf-eye" id="lfEye" aria-label="Show password"></button>
            <i class="lf-line"></i>
          </div>

          <div class="lf-row">
            <label class="check"><input type="checkbox" id="lfRemember" checked><span></span>Keep me signed in</label>
            <a href="#" id="lfForgot">Forgot password?</a>
          </div>

          <p class="lf-error" id="lfError" role="alert"></p>

          <button class="login-btn" id="lfSubmit" type="submit"><span>Sign in</span><i class="spin"></i></button>
        </form>

        <div class="demo-box">
          <small>Demo accounts – tap to fill</small>
          <div>
            <button type="button" class="demo-chip" data-demo="admin|admin123"><b>Admin</b> admin / admin123</button>
            <button type="button" class="demo-chip" data-demo="staff|staff123"><b>Staff</b> staff / staff123</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- =====================  APP  ===================== -->
  <div id="app" class="app hidden">

    <header class="topbar">
      <div class="brand" id="topBrand"></div>
      <button class="icon-btn top-burger" data-action="toggle-sidebar" aria-label="Toggle menu" data-ic="burger"
        data-size="22"></button>

      <label class="search" aria-label="Search dishes">
        <input id="globalSearch" data-input="search" type="search" placeholder="Search dishes..." autocomplete="off">
        <span data-ic="search" data-size="17"></span>
      </label>

      <div class="top-actions">
        <button class="btn gold sm book-btn" data-action="book-table"><span data-ic="calendar"
            data-size="16"></span>Book a Table</button>
        <button class="icon-btn cart-btn" data-action="goto-cart" aria-label="Open basket">
          <span data-ic="cart" data-size="22"></span>
          <b class="badge-dot" id="cartBadge">0</b>
        </button>
        <div class="user-menu" id="userMenu">
          <button class="user-btn" data-action="toggle-user" aria-haspopup="true">
            <span class="avatar" id="userAvatar">A</span>
            <span class="user-hi" id="userHi">Hi, Admin</span>
            <span data-ic="chevron" data-size="16"></span>
          </button>
          <div class="user-drop" id="userDrop"></div>
        </div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <nav id="nav"></nav>
      <div class="offer" id="offerCard"></div>
    </aside>

    <main class="main" id="main">
      <div id="view"></div>
    </main>

    <!-- mobile bottom checkout bar -->
    <div class="checkout-bar" id="checkoutBar">
      <div class="cb-total" data-action="goto-cart"><small>Total</small><b id="cbTotal">₹0</b></div>
      <button class="btn gold lg" data-action="checkout">Proceed to Pay</button>
    </div>
  </div>

  <div id="scrim"></div>
  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="printArea"></div>

  <script src="script.js"></script>
</body>

</html>
